<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · Planificateur</title>
<style>:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--bd:#dcdad2;--acc:#2c6fd6;--bad:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--card:#222220;--bd:#3a3a36;--acc:#6aa3ff;--bad:#ff7b6b;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:min(340px,calc(100vw - 32px));display:grid;gap:12px}
h1{font-size:18px;margin:0}label{display:grid;gap:4px;font-size:13px}input{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}#m{color:var(--bad);font-size:13px;min-height:1em}</style></head><body>
<form id="f"><h1>Planificateur de chargement</h1><label>Utilisateur<input id="u" autocomplete="username" required autofocus></label><label>Mot de passe<input id="p" type="password" autocomplete="current-password" required></label><div id="m" role="alert"></div><button>Se connecter</button></form>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,password:p.value})});if(r.ok)location.href='/';else m.textContent=(await r.json().catch(()=>({}))).error||'Échec de la connexion.'}</script></body></html>
