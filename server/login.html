<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · Planificateur</title>
<style>:root{--bg:#0e1113;--fg:#e5e7eb;--card:#161a1d;--bd:#2a3036;--acc:#8cdb00;--bad:#ef7a6c;color-scheme:dark}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:min(340px,calc(100vw - 32px));display:grid;gap:12px}
h1{font-size:18px;margin:0}label{display:grid;gap:4px;font-size:13px}input{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:10px;border:0;border-radius:8px;background:var(--acc);color:#0e1113;font:inherit;font-weight:700;cursor:pointer}.b{font-weight:800;letter-spacing:.04em}.s{color:var(--acc);font-weight:700;letter-spacing:.08em;font-size:11px;text-transform:uppercase}#m{color:var(--bad);font-size:13px;min-height:1em}</style></head><body>
<form id="f"><div style="display:flex;align-items:center;gap:12px"><span style="width:56px;height:40px;padding:5px 6px;border-radius:10px;background:#0e1113;border:1px solid var(--bd);flex:none"><svg viewBox="0 0 100 64" width="100%" height="100%" aria-hidden="true"><g transform="skewX(-12) translate(10 0)" fill="none" stroke-linejoin="round"><path d="M44 16H21C11 16 11 32 21 32H31C41 32 41 48 31 48H6" stroke="#dfe1e6" stroke-width="11" stroke-linecap="butt"/><path d="M92 16H66C54 16 54 48 66 48H92" stroke="#dfe1e6" stroke-width="11" stroke-linecap="butt"/><path d="M38 24L26 60" stroke="#8cdb00" stroke-width="3.2" stroke-dasharray="5 3.5"/></g></svg></span><div><div class="b">STEVE CORBEIL</div><div class="s">Planificateur de chargement</div></div></div><label>Utilisateur<input id="u" autocomplete="username" required autofocus></label><label>Mot de passe<input id="p" type="password" autocomplete="current-password" required></label><div id="m" role="alert"></div><button>Se connecter</button><a href="/" style="color:#8cdb00;font-size:13px;text-align:center;text-decoration:none">← Retour au planificateur</a></form>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,password:p.value})});if(r.ok)location.href='/';else m.textContent=(await r.json().catch(()=>({}))).error||'Échec de la connexion.'}</script></body></html>
